AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  lambda-rss

  Sample SAM Template for lambda-rss

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  RSSFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          DYNAMODB_TABLE: ""
          TELEGRAM_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
      Policies:
        - AWSLambdaExecute
        - AmazonDynamoDBFullAccess
      Events:
        RSS:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: schedule
            Description: Run every hour
            Enabled: True
    Metadata:
      DockerTag: provided.al2023-v1
      DockerContext: ./app
      Dockerfile: Dockerfile

Outputs:
  RSSFunction:
    Description: "RSS Lambda Function ARN"
    Value: !GetAtt RSSFunction.Arn
  RSSFunctionIamRole:
    Description: "Implicit IAM Role created for RSS function"
    Value: !GetAtt RSSFunctionRole.Arn